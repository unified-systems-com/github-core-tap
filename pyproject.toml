# TAP GitHub Core plugin — package-mode distribution (namespaced 2026-07-01).
#
# Identity chain (pre-boot conformance gate enforces agreement):
#   slug             = "github_core"
#   distribution     = "github-core-tap"
#   import namespace = "tap_plugin.github_core"   (PEP 420 — no tap_plugin/__init__.py)
#   entry-point key  = "github_core"              (== slug)
#
# Migrated OUT of [tool.uv.workspace] members (root pyproject.toml): a package-mode
# plugin installs via the pre-boot stage from the boot profile's `install` section,
# NOT via `uv sync --all-packages`. Its Tier-0 deps (PyYAML) travel with it and uv
# resolves them at plugin-install time (req-plugin-arch-dependencies-1).
[project]
name = "github-core-tap"
description = "TAP GitHub Core plugin — GitHub Actions deployment plumbing for samsite."
requires-python = ">=3.14"
dynamic = ["version"]

# Tier-0 dependencies (req-plugin-arch-dependencies-1): github_core's collector parses
# workflow YAML, so PyYAML is a plugin-SPECIFIC third-party dep (not core-provided).
# It rides with the plugin — uv resolves it when the pre-boot stage installs github_core.
dependencies = [
    "PyYAML>=6.0.2",
    # The collector imports identity_core.issuer to mint the OIDC issuer node and
    # ENABLED_ON targets its type — a code + vocabulary dependency (downward-only).
    "tap-plugin-identity-core",
    # The collector mints git_core's repository / ref / commit ids through
    # tap_plugin.git_core.identity and emits those neutral types (github-core#76).
    "git-core-tap>=0.1.0,<0.2",
    # The collector mints compliance_core__compliance_finding for every scanner alert and
    # DETAILS_FINDING targets its type — a vocabulary + type dependency (github-core#89).
    "tap-plugin-compliance-core>=0.4.0,<0.5",
]

[project.entry-points."tap.plugins"]
github_core = "tap_plugin.github_core.apps:GithubCoreConfig"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# VCS-derived PEP 440 version (req-plugin-arch-versioning-1); no hand-maintained field.
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

# PEP 420 namespace build: ship tap_plugin/github_core/* with no tap_plugin/__init__.py.
[tool.hatch.build.targets.wheel]
only-include = ["tap_plugin/github_core"]
